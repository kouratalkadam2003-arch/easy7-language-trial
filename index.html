<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy7 - تعلم اللغات بسحر الذكاء الاصطناعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&family=Cairo:wght@400;600;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var customFetch = origFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return customFetch; },
              set: function(val) { customFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          try {
             var origFetch = window.fetch;
             if (origFetch) {
                var customFetch = origFetch.bind(window);
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return customFetch; },
                  set: function(val) { customFetch = val; },
                  configurable: true,
                  enumerable: true
                });
             }
          } catch(e2) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) { 
        document.body.innerHTML = '<div style="background:red;color:white;padding:20px;font-size:20px;z-index:999999;position:fixed;top:0;left:0;width:100%;height:100%;"><h1>CRASH</h1><pre>' + (error ? error.stack : message) + '</pre></div>'; 
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="background:red;color:white;padding:20px;font-size:20px;z-index:999999;position:fixed;top:0;left:0;width:100%;height:100%;"><h1>PROMISE CRASH</h1><pre>' + (event.reason ? event.reason.stack : event.reason) + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
