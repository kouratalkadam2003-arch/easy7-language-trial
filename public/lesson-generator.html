<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy 7language - Lesson Generator</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin: 0;
        }

        .input-group {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .form-field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lesson-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            overflow: hidden;
            display: none; /* Hidden by default */
            animation: slideUp 0.5s ease-out;
        }

        .lesson-header {
            background: var(--primary);
            color: white;
            padding: 20px;
        }

        .lesson-content {
            padding: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h3 {
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        .example-item {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--secondary);
        }

        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #64748b;
            min-height: 20px;
        }

        .source-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .source-firebase { background-color: #dcfce7; color: #166534; }
        .source-ai { background-color: #dbeafe; color: #1e40af; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Easy 7language</h1>
        <p>AI-Powered Lesson Generator</p>
    </div>

    <div class="input-group">
        <div class="form-field">
            <label for="apiKey">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="Paste your Gemini API Key here">
        </div>
        <div class="form-field">
            <label for="language">Target Language</label>
            <select id="language">
                <option value="Japanese">Japanese</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
                <option value="Italian">Italian</option>
                <option value="Chinese">Chinese</option>
                <option value="Arabic">Arabic</option>
            </select>
        </div>
        <div class="form-field">
            <label for="topic">Topic</label>
            <input type="text" id="topic" placeholder="e.g., Ordering Coffee, Introducing Yourself">
        </div>
        <button id="generateBtn" onclick="handleGenerate()">Generate Lesson</button>
        <div id="status" class="status-msg"></div>
    </div>

    <div id="lessonCard" class="lesson-card">
        <div class="lesson-header">
            <h2 id="lessonTitle" style="margin:0;">Lesson Title</h2>
            <span id="lessonSource" class="source-badge"></span>
        </div>
        <div class="lesson-content">
            <div class="section">
                <h3>Explanation</h3>
                <p id="lessonExplanation">...</p>
            </div>
            <div class="section">
                <h3>Examples</h3>
                <div id="lessonExamples"></div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // --- CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyDUiMMjKAffWILO7iZRhnEmmoP3ASQKWr0",
        authDomain: "easy7lang.firebaseapp.com",
        projectId: "easy7lang",
        storageBucket: "easy7lang.firebasestorage.app",
        messagingSenderId: "130421686589",
        appId: "1:130421686589:web:4261c8842b8645b1917d6a"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Expose functions to global scope for the button onclick
    window.handleGenerate = async () => {
        const apiKey = document.getElementById('apiKey').value;
        const language = document.getElementById('language').value;
        const topic = document.getElementById('topic').value;
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('generateBtn');

        if (!apiKey || !topic) {
            alert("Please enter both an API Key and a Topic.");
            return;
        }

        // Reset UI
        document.getElementById('lessonCard').style.display = 'none';
        btn.disabled = true;
        statusEl.textContent = "Checking database...";

        const docId = `${language}_${topic.replace(/\s+/g, '_').toLowerCase()}`;
        const docRef = doc(db, "lessons_simple", docId);

        try {
            // 1. Check Firebase
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                console.log("Found in Firebase!");
                statusEl.textContent = "Lesson found in database!";
                renderLesson(docSnap.data(), "Source: Firebase Cache");
            } else {
                // 2. Not found, Call Gemini
                console.log("Not found. Calling Gemini...");
                statusEl.textContent = "Generating with AI (this may take a few seconds)...";
                
                const lessonData = await generateWithGemini(apiKey, language, topic);
                
                if (lessonData) {
                    // 3. Save to Firebase
                    statusEl.textContent = "Saving to database...";
                    await setDoc(docRef, lessonData);
                    
                    renderLesson(lessonData, "Source: Gemini AI (Generated & Saved)");
                }
            }
        } catch (error) {
            console.error(error);
            statusEl.textContent = "Error: " + error.message;
        } finally {
            btn.disabled = false;
        }
    };

    async function generateWithGemini(apiKey, language, topic) {
        const prompt = `
            Create a language lesson for ${language} about "${topic}".
            Return ONLY valid JSON with this structure:
            {
                "title": "Lesson Title",
                "explanation": "Brief explanation of the concept.",
                "examples": [
                    { "phrase": "Foreign Phrase", "translation": "English Translation" },
                    { "phrase": "Foreign Phrase 2", "translation": "English Translation 2" }
                ]
            }
        `;

        // FIX (see INCIDENTS.md): gemini-3.1-flash-live-preview is Live/WebSocket-only.
        // REST generateContent against it returns 404 NOT_FOUND. Use the text model instead.
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        if (!response.ok) throw new Error("AI Request Failed");

        const data = await response.json();
        const text = data.candidates[0].content.parts[0].text;
        
        // Clean JSON (remove markdown code blocks if present)
        const jsonStr = text.replace(/```json/g, '').replace(/```/g, '').trim();
        return JSON.parse(jsonStr);
    }

    function renderLesson(data, sourceLabel) {
        document.getElementById('lessonTitle').textContent = data.title;
        document.getElementById('lessonExplanation').textContent = data.explanation;
        
        const examplesContainer = document.getElementById('lessonExamples');
        examplesContainer.innerHTML = '';
        
        data.examples.forEach(ex => {
            const div = document.createElement('div');
            div.className = 'example-item';
            div.innerHTML = `<strong>${ex.phrase}</strong><br><small>${ex.translation}</small>`;
            examplesContainer.appendChild(div);
        });

        const sourceEl = document.getElementById('lessonSource');
        sourceEl.textContent = sourceLabel;
        sourceEl.className = 'source-badge ' + (sourceLabel.includes('Firebase') ? 'source-firebase' : 'source-ai');

        document.getElementById('lessonCard').style.display = 'block';
        document.getElementById('status').textContent = "Done!";
    }
</script>

</body>
</html>
